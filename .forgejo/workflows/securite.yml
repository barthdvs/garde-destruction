# Analyses de sécurité : secrets (Gitleaks), code (Semgrep), dépendances et configuration (Trivy).
# Chaque analyse fait échouer la CI si elle trouve quelque chose.
# Sur main, les résultats partent aussi vers DefectDojo quand le dépôt définit la variable
# DEFECTDOJO_URL et le secret DEFECTDOJO_JETON ; sinon l'envoi est sauté.
name: securite

on:
  push:
    branches: [main]
  pull_request:

env:
  DD_URL: ${{ vars.DEFECTDOJO_URL }}

jobs:
  gitleaks:
    name: Secrets (Gitleaks)
    runs-on: docker
    container:
      image: zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
    env:
      TYPE_DD: Gitleaks Scan
    defaults:
      run:
        shell: sh
    steps:
      - &sources
        name: Sources (historique complet)
        env:
          JETON_DEPOT: ${{ github.token }}
        run: |
          set -eu
          git init -q .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          GIT_CONFIG_VALUE_0="Authorization: basic $(printf 'x-access-token:%s' "$JETON_DEPOT" | base64 | tr -d '\n')"
          export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.extraHeader GIT_CONFIG_VALUE_0
          git fetch -q origin "$GITHUB_REF"
          git checkout -q FETCH_HEAD
      - name: Analyse de tout l'historique
        id: analyse
        continue-on-error: true
        run: gitleaks git --redact --no-banner -v --report-format json --report-path rapport.json .
      - &envoi
        name: Envoi à DefectDojo
        if: always() && github.event_name == 'push' && env.DD_URL != ''
        env:
          DD_JETON: ${{ secrets.DEFECTDOJO_JETON }}
        run: |
          set -eu
          command -v curl >/dev/null || apk add -q --no-cache curl
          umask 077
          printf 'header = "Authorization: Token %s"\n' "$DD_JETON" > /tmp/dd.cfg
          curl -sS --fail-with-body -o /tmp/dd.txt -K /tmp/dd.cfg "$DD_URL/api/v2/reimport-scan/" \
            -F "scan_type=$TYPE_DD" -F "file=@rapport.json" \
            -F "product_type_name=Forgejo" -F "product_name=$GITHUB_REPOSITORY" \
            -F "engagement_name=CI $GITHUB_REF_NAME" -F "auto_create_context=true" \
            -F "close_old_findings=true" -F "deduplication_on_engagement=true" \
            -F "commit_hash=$GITHUB_SHA" -F "branch_tag=$GITHUB_REF_NAME" \
            || { cat /tmp/dd.txt; rm -f /tmp/dd.cfg; exit 1; }
          rm -f /tmp/dd.cfg
          echo "Envoyé à DefectDojo : $TYPE_DD"
      - &verdict
        name: Verdict
        if: steps.analyse.outcome == 'failure'
        run: |
          echo "L'analyse a trouvé des problèmes (détail plus haut)."
          exit 1

  semgrep:
    name: Code (Semgrep)
    runs-on: docker
    container:
      image: semgrep/semgrep:1.178.0@sha256:32e459968daabe7ab86968184a29109b9564aa00392401156f9788452b42786b
    env:
      TYPE_DD: Semgrep JSON Report
    defaults:
      run:
        shell: sh
    steps:
      - *sources
      - name: Analyse du code (règles p/default)
        id: analyse
        continue-on-error: true
        run: semgrep scan --config p/default --metrics=off --error --json-output=rapport.json
      - *envoi
      - *verdict

  trivy:
    name: Dépendances et configuration (Trivy)
    runs-on: docker
    container:
      image: aquasec/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa
    env:
      TYPE_DD: Trivy Scan
    defaults:
      run:
        shell: sh
    steps:
      - *sources
      - name: Analyse (vulnérabilités, secrets, configuration)
        id: analyse
        continue-on-error: true
        run: |
          set -eu
          trivy fs --quiet --scanners vuln,secret,misconfig --format json --output rapport.json .
          trivy fs --quiet --skip-db-update --scanners vuln,secret,misconfig --severity HIGH,CRITICAL --exit-code 1 .
      - *envoi
      - *verdict
